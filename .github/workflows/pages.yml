name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 桌面沙盘在 /last-order/，手机 PWA（含 ?mode=run/blitz/match/duel）在 /last-order/m/。
      - run: npm run build
        env:
          VITE_BASE: /last-order/
      - run: npm ci && npm run build
        working-directory: dynamic-counter-prototype
        env:
          VITE_BASE: /last-order/m/
      - run: cp dist/index.html dist/404.html
      # 把手机版产物挪进根 dist 的 m/ 子目录一起上传；m/404.html 兜底深链刷新。
      - run: mkdir -p dist/m && cp -r dynamic-counter-prototype/dist/client/. dist/m/ && cp dynamic-counter-prototype/dist/client/index.html dist/m/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
