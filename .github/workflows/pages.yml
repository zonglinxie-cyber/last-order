name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dynamic-counter-prototype/package-lock.json
      # 旧版（桌面沙盘与五日剧情）已删：/last-order/m/ 是人情场本体，/last-order/ 只剩一页跳转，
      # 以前分享出去的根地址和已经装到桌面的 PWA（scope 在 m/）都还打得开。
      - run: npm ci && npm run build
        working-directory: dynamic-counter-prototype
        env:
          VITE_BASE: /last-order/m/
      - run: |
          mkdir -p dist/m
          cp -r dynamic-counter-prototype/dist/client/. dist/m/
          cp dynamic-counter-prototype/dist/client/index.html dist/m/404.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./m/"><title>最后一单</title><a href="./m/">进入《最后一单 · 人情场》</a>' > dist/index.html
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
